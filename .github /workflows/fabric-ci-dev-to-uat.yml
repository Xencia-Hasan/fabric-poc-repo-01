name: Auto PR Dev → UAT
 
on:
  push:
    branches:
      - dev
 
jobs:
  create-pr-to-uat:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Create PR from dev to uat
        uses: repo-sync/pull-request@v2
        with:
          source_branch: dev
          destination_branch: uat
          pr_title: "Promote dev → uat"
          pr_body: |
            Automated PR from **dev** to **uat**.
            Please review and approve to promote to main workspace.
          github_token: ${{ github.token }}
